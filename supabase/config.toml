# GoFish Supabase Local Config
#
# IMPORTANT: Ports are offset +10 from Supabase defaults to avoid
# conflicts with other local Supabase projects (e.g. your work app).
#
# Default ports -> GoFish ports:
#   API:     54321 -> 54331
#   DB:      54322 -> 54332
#   Studio:  54323 -> 54333
#   Inbucket:54324 -> 54334
#   Pooler:  54329 -> 54339
#   Shadow:  54320 -> 54330

[project]
id = "gofish"

[api]
enabled = true
port = 54331
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54332
shadow_port = 54330
major_version = 15

[db.pooler]
enabled = false
port = 54339
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[realtime]
enabled = true

[studio]
enabled = true
port = 54333
api_url = "http://127.0.0.1"

[inbucket]
enabled = true
port = 54334

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["https://127.0.0.1:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
# Enable OTP / magic link
enable_otp = true
otp_length = 6
otp_expiry = 300

[auth.external.apple]
enabled = false

[auth.external.azure]
enabled = false

[auth.external.google]
enabled = true
client_id = "env(GOOGLE_CLIENT_ID)"
secret = "env(GOOGLE_CLIENT_SECRET)"
redirect_uri = "http://127.0.0.1:54331/auth/v1/callback"

[auth.external.facebook]
enabled = true
client_id = "env(FACEBOOK_CLIENT_ID)"
secret = "env(FACEBOOK_CLIENT_SECRET)"
redirect_uri = "http://127.0.0.1:54331/auth/v1/callback"

[analytics]
enabled = false
